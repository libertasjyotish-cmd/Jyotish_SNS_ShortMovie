name: Auto merge

on:
  status:
  check_suite:
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull requests whose checks have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list --state open --base main --json number --jq '.[].number'); do
            state=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            mergeable=$(gh pr view "$pr" --json mergeable --jq .mergeable)
            draft=$(gh pr view "$pr" --json isDraft --jq .isDraft)
            echo "PR #$pr: mergeable=$mergeable state=$state draft=$draft"
            if [ "$draft" = "true" ] || [ "$mergeable" != "MERGEABLE" ]; then
              continue
            fi
            if [ "$state" = "BLOCKED" ] || [ "$state" = "DIRTY" ] || [ "$state" = "BEHIND" ]; then
              continue
            fi
            # This job is itself a pending check on the PR, so it is left out of the verdict.
            pending=$(gh pr checks "$pr" --json name,state \
              --jq '[.[] | select(.name != "merge") | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL")] | length')
            if [ "$pending" != "0" ]; then
              echo "PR #$pr: checks not green yet"
              continue
            fi
            gh pr merge "$pr" --squash --delete-branch
          done
